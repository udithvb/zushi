# =====================================================================
# PREFIX & SESSION CONTROLS
# =====================================================================
# unbind C-b
set-option -g prefix C-a
bind-key r source-file ~/.tmux.conf
bind-key u attach -t base

# Double-tap C-a to send C-a to a nested/inner tmux session
bind-key C-a send-prefix

# =====================================================================
# NESTED TMUX TOGGLE (F12)
# =====================================================================
# Press F12 to disable outer prefix/keys, allowing direct inner session control
bind -T root F12  \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=color8,bg=black" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S \;\

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S

# =====================================================================
# KITTY, MOUSE, & TERMINAL SETTINGS
# =====================================================================
# Optimized default terminal for Kitty features (True Color, undercurls)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -g set-clipboard on

setw -g mouse on
# Middle mouse click pasting using xclip
bind -T root MouseDown2Pane run -b "xclip -o | tmux load-buffer - && tmux paste-buffer -s ' '"

set -g base-index 1
setw -g aggressive-resize on

# =====================================================================
# SHELL CONFIGURATION (Fish)
# =====================================================================
# Updated to target fish instead of zsh/bash
set -g default-command "/usr/bin/env fish"

# =====================================================================
# UI & STATUS BAR
# =====================================================================
set -g status-bg black
set -g status-fg white
set -g status-left "  "

# =====================================================================
# NAVIGATION & WINDOW MANAGEMENT
# =====================================================================
bind-key tab last-pane
setw -g mode-keys vi

bind-key | split-window -h
bind-key - split-window -v
bind-key enter new-window
unbind c

# Pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r C-h resize-pane -L
bind -r C-j resize-pane -D
bind -r C-k resize-pane -U
bind -r C-l resize-pane -R

# Synchronize panes toggle
bind v setw synchronize-panes

# =====================================================================
# COPY MODE (VI KEYS)
# =====================================================================
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi b send-keys -X rectangle-toggle
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -i -f -selection primary"
