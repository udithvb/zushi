# =====================================================================
# PREFIX & SESSION CONTROLS
# =====================================================================
# unbind C-b
set-option -g prefix C-a
bind-key r source-file ~/.tmux.conf
bind-key u attach -t base

# Double-tap C-a to send C-a to a nested/inner tmux session
bind-key C-a send-prefix

# =====================================================================
# NESTED TMUX TOGGLE (F12)
# =====================================================================
# Press F12 to disable outer prefix/keys, allowing direct inner session control
bind -T root F12  \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=color8,bg=black" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S \;\

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S

# =====================================================================
# KITTY, MOUSE, & TERMINAL SETTINGS
# =====================================================================
# Optimized default terminal for Kitty features (True Color, undercurls)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
# Advertise OSC 52 clipboard support to both the real terminal (Kitty)
# and to a nested tmux (which sees TERM=tmux-256color)
set -as terminal-features ",xterm-kitty:clipboard,tmux-256color:clipboard"

# Enable extended keys (tmux 3.2+) so modified key combos (Ctrl+i, Shift+Enter, etc.)
# are forwarded via CSI-u sequences instead of being collapsed to legacy codes.
set -g extended-keys on

# OSC 52 clipboard chaining (nested tmux -> outer tmux -> Kitty -> macOS):
# set-clipboard on  = accept OSC 52 from apps (inner tmux) AND set clipboard
# allow-passthrough = let escape sequences pass through to the outer terminal
set -g set-clipboard on
set -g allow-passthrough on

setw -g mouse on
# Middle mouse click pasting (pbpaste on macOS, xclip on Linux)
if-shell "uname | grep -q Darwin" {
  bind -T root MouseDown2Pane run -b "pbpaste | tmux load-buffer - && tmux paste-buffer -s ' '"
} {
  bind -T root MouseDown2Pane run -b "xclip -o | tmux load-buffer - && tmux paste-buffer -s ' '"
}

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 50
set -g focus-events on
set -g history-limit 50000
setw -g aggressive-resize on

# =====================================================================
# SHELL CONFIGURATION (Fish)
# =====================================================================
# Updated to target fish instead of zsh/bash
set -g default-command "/usr/bin/env fish"

# =====================================================================
# UI & STATUS BAR
# =====================================================================
set -g status-style "bg=black,fg=white"
set -g status-left "#[fg=cyan,bold] #S #[default] "
set -g status-left-length 30
set -g status-right " #{?pane_synchronized,#[fg=red]SYNC#[default],} #[fg=color8]#(whoami)@#H #[fg=cyan]%H:%M %d-%b-%y "
set -g status-right-length 60

setw -g window-status-format "#[fg=color8] #I:#W "
setw -g window-status-current-format "#[fg=white,bold,bg=color8] #I:#W* "
set -g status-justify centre

# Pane borders
set -g pane-border-style "fg=color8"
set -g pane-active-border-style "fg=cyan"

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# =====================================================================
# NAVIGATION & WINDOW MANAGEMENT
# =====================================================================
bind-key tab last-pane
setw -g mode-keys vi

bind-key | split-window -h -c '#{pane_current_path}'
bind-key - split-window -v -c '#{pane_current_path}'
bind-key enter new-window -c '#{pane_current_path}'
unbind c

# Pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r C-h resize-pane -L
bind -r C-j resize-pane -D
bind -r C-k resize-pane -U
bind -r C-l resize-pane -R

# Synchronize panes toggle
bind v setw synchronize-panes

# Alt+vim keys for pane switching without prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Scratch popup terminal (prefix + `)
bind-key ` display-popup -E -d '#{pane_current_path}' -w 80% -h 80% "fish"

# Jump to last window
bind-key b last-window

# =====================================================================
# COPY MODE (VI KEYS)
# =====================================================================
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi b send-keys -X rectangle-toggle
# y/Enter copy to system clipboard:
# macOS uses pbcopy; Linux relies on OSC 52 chain (inner -> outer -> Kitty -> macOS)
if-shell "uname | grep -q Darwin" {
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
} {
  bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
  bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
}
